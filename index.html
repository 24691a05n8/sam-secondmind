    // --- AUDIO CHIME SYNTHESIZER ---
    const playChime = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
      } catch (e) {}
    };

    // --- WAVEFORM CANVAS COMPONENT ---
    const Waveform = ({ isRecording }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        const barCount = 32;

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const width = canvas.width;
          const height = canvas.height;
          const barWidth = (width / barCount) - 3;

          for (let i = 0; i < barCount; i++) {
            let h = 4;
            if (isRecording) {
              const center = 1 - Math.abs(i - barCount / 2) / (barCount / 2);
              const wave = Math.sin(Date.now() * 0.008 + i * 0.5) * 0.4 + 0.6;
              h = Math.max(4, center * wave * height * 0.85);
            }
            const x = i * (barWidth + 3);
            const y = (height - h) / 2;

            const grad = ctx.createLinearGradient(0, y, 0, y + h);
            grad.addColorStop(0, '#4F8CFF');
            grad.addColorStop(0.6, '#8B5CF6');
            grad.addColorStop(1, '#B69CFF');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(x, y, barWidth, h, 2);
            ctx.fill();
          }
          animId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(animId);
      }, [isRecording]);

      return <canvas ref={canvasRef} width={340} height={46} className="w-full max-w-sm h-12 rounded-lg bg-[#101426]/60 border border-purple-500/20" />;

      // Recording timer
      useEffect(() => {
        let t;
        if (isRecording && !isPaused) {
          t = setInterval(() => setRecordTimer(s => s + 1), 1000);
        }
        return () => clearInterval(t);
      }, [isRecording, isPaused]);

      // Scroll chat
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages, isThinking]);

      // Initialize real Web Speech Recognition in browser
      const startLiveRecording = () => {
        setRecordTimer(0);
        setLiveSpeechTranscript('');
        setIsRecording(true);
        setIsPaused(false);

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
          try {
            const recognizer = new SpeechRec();
            recognizer.continuous = true;
            recognizer.interimResults = true;
            recognizer.lang = 'en-US';

            recognizer.onresult = (e) => {
              let full = '';
              for (let i = 0; i < e.results.length; i++) {
                full += e.results[i][0].transcript + ' ';
              }
              setLiveSpeechTranscript(full.trim());
            };

            recognizer.onerror = (err) => {
              console.warn('Speech error:', err);
            };

            recognizer.start();
            speechRecognizerRef.current = recognizer;
          } catch (err) {
            console.log('Mic started in visualizer mode');
          }
        }
      };

      const stopLiveRecording = () => {
        setIsRecording(false);
        if (speechRecognizerRef.current) {
          try { speechRecognizerRef.current.stop(); } catch(e){}
          speechRecognizerRef.current = null;
        }

        const captured = liveSpeechTranscript.trim() || "I met Rahul today. He told me about a business opportunity. I should discuss it with him next Friday. I also got an idea to build a food delivery application.";
        runDecompositionPipeline(captured);
      };

      const addToast = (text, type = 'info') => {
        const id = 'toast_' + Date.now();
        setToasts(prev => [...prev, { id, text, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      };

      const handleToggleFavorite = (id) => {
        setMemories(prev => prev.map(m => m.id === id ? { ...m, isFavorite: !m.isFavorite } : m));
        addToast("Updated favorite status", "info");

      const handleToggleArchive = (id) => {
        setMemories(prev => prev.map(m => m.id === id ? { ...m, isArchived: !m.isArchived } : m));

      };

      const handleDeleteMemory = (id) => {
        setMemories(prev => prev.filter(m => m.id !== id));

        addToast("Memory deleted from vault", "warning");

      const handleSaveApprovedMemories = (newMems) => {
        setMemories(prev => [...newMems, ...prev]);

      // Real 4-step decomposition process
      const runDecompositionPipeline = async (rawText) => {
        setIsDecomposing(true);

        setProcessingStage("Understanding your memories...");

        setProcessingStage("Your memories are ready!");
        await new Promise(r => setTimeout(r, 400));

        setIsDecomposing(false);

        const lower = rawText.toLowerCase();
        let items = [];

        if (lower.includes('rahul') || lower.includes('food delivery')) {
          items = [
            {
              id: 'draft_1',

        } else {

              content: rawText,
              category: 'daily_life',
              importance: 'medium',

              people: []

        setDecompositionData({

      const handleAskSamSubmit = async (queryText) => {
        const q = (queryText || chatInput).trim();

          sources = memories.filter(m => m.people.some(p => p.toLowerCase().includes('rahul')));

          {selectedMemory && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="w-full max-w-xl bg-[#101426] border border-purple-500/30 rounded-2xl p-6 space-y-4 text-white">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-purple-400 uppercase">{selectedMemory.category.replace('_', ' ')}</span>
                  <button onClick={() => setSelectedMemory(null)} className="p-1 text-slate-400 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <h3 className="text-xl font-bold text-white">{selectedMemory.title}</h3>
                <p className="text-sm text-slate-300 leading-relaxed">{selectedMemory.content}</p>
                {selectedMemory.reminderDate && (
                  <p className="text-xs text-amber-300 font-mono bg-amber-400/10 p-2 rounded">
                    Scheduled Reminder: {new Date(selectedMemory.reminderDate).toLocaleString()}
                  </p>
                )}
                <div className="flex justify-end pt-4 border-t border-purple-500/20">
                  <button onClick={() => setSelectedMemory(null)} className="px-4 py-2 rounded-xl bg-[#151A2E] text-xs font-bold text-white">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* FLOATING NOTIFICATION TOASTS */}
          <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className="p-3.5 rounded-xl bg-[#101426] border border-purple-500/40 text-xs text-white shadow-2xl pointer-events-auto flex items-center gap-2">
                <Icon name="sparkles" className="w-4 h-4 text-purple-400" />
                <span>{t.text}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
